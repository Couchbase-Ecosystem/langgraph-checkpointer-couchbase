name: Label pull requests

# Applies the release-note labels documented in AGENTS.md, so the notes generated by
# draft-release.yml stay grouped even when a PR is opened without them. An unlabelled PR falls
# through to "Other changes" in .github/release.yml.
#
# Labels are only ever added, never removed, so a maintainer's correction is kept on the next
# push. It labels what the diff and the title prove, and stays quiet otherwise.
#
# pull_request_target rather than pull_request, because the token given to a forked
# `pull_request` run is read-only and could not label anything. Nothing from the head branch is
# checked out or executed here, and the PR title and body reach the script only through `env`,
# never through `${{ }}` interpolation.

on:
  pull_request_target:
    # `edited` covers a title being fixed after the PR was opened.
    types: [opened, reopened, synchronize, edited, ready_for_review]

concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Creating repository labels is governed by `issues`; applying them to a PR by `pull-requests`.
  issues: write
  pull-requests: write

jobs:
  label:
    name: Apply release-note labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Applying a label that does not exist fails. Create the missing ones so this list,
      # AGENTS.md and .github/release.yml stay in step; existing labels are left alone.
      - name: Create any missing labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing="$(gh label list --limit 200 --json name --jq '.[].name')"
          while IFS='|' read -r name colour description; do
            if ! grep -qxF "$name" <<<"$existing"; then
              echo "Creating missing label: $name"
              gh label create "$name" --color "$colour" --description "$description"
            fi
          done <<'LABELS'
          breaking-change|b60205|User-visible behaviour or supported versions change
          enhancement|a2eeef|New functionality
          bug|d73a4a|Fixes
          testing|bfd4f2|Test suite changes
          ci|c5def5|Workflows and release automation
          documentation|0075ca|Documentation only
          dependencies|0366d6|Dependency updates
          skip-changelog|ededed|Version bumps and chores kept out of the release notes
          LABELS

      # Path rules live in .github/labeler.yml. Under pull_request_target the action reads that
      # config from the base branch, not from the PR.
      - name: Label by changed paths
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false
          # Without this the `.github/**` rule matches nothing.
          dot: true

      - name: Label by title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          labels=()
          add() { labels+=("$1"); echo "+ $1 ($2)"; }

          # Only fires on a conventional-commit prefix. Prose titles contribute nothing here and
          # are left to the path rules, so this can under-label but never invent a category.
          if [[ "$PR_TITLE" =~ ^([a-zA-Z]+)(\(([^\)]*)\))?(!)?:[[:space:]] ]]; then
            type="$(tr '[:upper:]' '[:lower:]' <<<"${BASH_REMATCH[1]}")"
            scope="$(tr '[:upper:]' '[:lower:]' <<<"${BASH_REMATCH[3]}")"
            breaking="${BASH_REMATCH[4]}"

            # chore(deps), fix(deps-dev), …: a deps scope settles the category on its own.
            # chore(release) is a version bump, which the notes leave out.
            case "$scope" in
              *deps*) add dependencies "($scope) scope"; type='' ;;
              release) add skip-changelog "(release) scope"; type='' ;;
            esac

            case "$type" in
              feat) add enhancement 'feat: title' ;;
              fix) add bug 'fix: title' ;;
              docs) add documentation 'docs: title' ;;
              test) add testing 'test: title' ;;
              ci | build) add ci "$type: title" ;;
              deps) add dependencies 'deps: title' ;;
            esac

            # Breaking is a judgement about user-facing compatibility, so only the author's own
            # declaration counts.
            [[ -n "$breaking" ]] && add breaking-change '! in the title'
          fi
          if grep -qE '^BREAKING[ -]CHANGE:' <<<"${PR_BODY:-}"; then
            add breaking-change 'BREAKING CHANGE: footer'
          fi

          if [[ ${#labels[@]} -eq 0 ]]; then
            echo 'No conventional-commit signal in the title; leaving it to the path rules.'
            exit 0
          fi
          printf -v joined '%s,' "${labels[@]}"
          gh pr edit "$PR_NUMBER" --add-label "${joined%,}"
